<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App | Abid Ali Panhwar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 20px;
        }
        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0.9;
            transition: opacity 0.3s;
        }
        .back-link:hover {
            opacity: 1;
        }
        h1 {
            color: white;
            margin-bottom: 30px;
            font-weight: 300;
            text-align: center;
        }
        .quiz-container {
            background: white;
            border-radius: 25px;
            padding: 35px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
        }
        .progress-bar {
            height: 8px;
            background: #eee;
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress {
            height: 100%;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        .question-number {
            color: #999;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        .question {
            font-size: 1.4rem;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.4;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option {
            padding: 18px 20px;
            border: 2px solid #eee;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
            color: #333;
            background: white;
            text-align: left;
        }
        .option:hover {
            border-color: #f093fb;
            background: #fef6ff;
        }
        .option.selected {
            border-color: #f093fb;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        .option.correct {
            border-color: #51cf66;
            background: #51cf66;
            color: white;
        }
        .option.incorrect {
            border-color: #ff6b6b;
            background: #ff6b6b;
            color: white;
        }
        .option.disabled {
            pointer-events: none;
        }
        .next-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 25px;
            transition: transform 0.2s, box-shadow 0.2s;
            display: none;
        }
        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(240, 147, 251, 0.4);
        }
        .next-btn.show {
            display: block;
        }
        .result {
            text-align: center;
            display: none;
        }
        .result.show {
            display: block;
        }
        .result-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        .result-score {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 10px;
        }
        .result-text {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 25px;
        }
        .restart-btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .restart-btn:hover {
            transform: scale(1.05);
        }
        .quiz-content {
            display: block;
        }
        .quiz-content.hide {
            display: none;
        }
    </style>
</head>
<body>
    <a href="../index.html#gallery" class="back-link">← Back to Portfolio</a>
    <h1>🧠 Tech Quiz</h1>
    <div class="quiz-container">
        <div class="quiz-content" id="quizContent">
            <div class="progress-bar">
                <div class="progress" id="progressBar" style="width: 20%"></div>
            </div>
            <p class="question-number" id="questionNumber">Question 1 of 5</p>
            <h2 class="question" id="question">Loading...</h2>
            <div class="options" id="options"></div>
            <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next Question</button>
        </div>
        <div class="result" id="result">
            <div class="result-icon" id="resultIcon">🏆</div>
            <h2 class="result-score" id="resultScore">5/5</h2>
            <p class="result-text" id="resultText">Perfect Score! You're a tech genius!</p>
            <button class="restart-btn" onclick="restartQuiz()">Play Again</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "What does HTML stand for?",
                options: ["Hyper Text Markup Language", "High Tech Modern Language", "Hyper Transfer Markup Language", "Home Tool Markup Language"],
                correct: 0
            },
            {
                question: "Which programming language is known as the 'language of the web'?",
                options: ["Python", "Java", "JavaScript", "C++"],
                correct: 2
            },
            {
                question: "What does CSS stand for?",
                options: ["Computer Style Sheets", "Cascading Style Sheets", "Creative Style System", "Colorful Style Sheets"],
                correct: 1
            },
            {
                question: "Which company developed React.js?",
                options: ["Google", "Microsoft", "Facebook (Meta)", "Apple"],
                correct: 2
            },
            {
                question: "What is the purpose of Git?",
                options: ["Web hosting", "Version control", "Database management", "Image editing"],
                correct: 1
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('question').textContent = q.question;
            document.getElementById('questionNumber').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
            document.getElementById('progressBar').style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
            
            const optionsHtml = q.options.map((opt, i) => 
                `<button class="option" onclick="selectOption(${i})">${opt}</button>`
            ).join('');
            
            document.getElementById('options').innerHTML = optionsHtml;
            document.getElementById('nextBtn').classList.remove('show');
            answered = false;
        }

        function selectOption(index) {
            if (answered) return;
            answered = true;

            const options = document.querySelectorAll('.option');
            const correct = questions[currentQuestion].correct;

            options.forEach((opt, i) => {
                opt.classList.add('disabled');
                if (i === correct) {
                    opt.classList.add('correct');
                } else if (i === index && index !== correct) {
                    opt.classList.add('incorrect');
                }
            });

            if (index === correct) {
                score++;
            }

            if (currentQuestion < questions.length - 1) {
                document.getElementById('nextBtn').textContent = 'Next Question';
            } else {
                document.getElementById('nextBtn').textContent = 'See Results';
            }
            document.getElementById('nextBtn').classList.add('show');
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quizContent').classList.add('hide');
            document.getElementById('result').classList.add('show');
            document.getElementById('resultScore').textContent = `${score}/${questions.length}`;

            let icon, text;
            const percentage = (score / questions.length) * 100;
            
            if (percentage === 100) {
                icon = '🏆';
                text = "Perfect Score! You're a tech genius!";
            } else if (percentage >= 80) {
                icon = '🌟';
                text = "Excellent! You really know your stuff!";
            } else if (percentage >= 60) {
                icon = '👍';
                text = "Good job! Keep learning!";
            } else if (percentage >= 40) {
                icon = '📚';
                text = "Not bad! Room for improvement.";
            } else {
                icon = '💪';
                text = "Keep practicing! You'll get better!";
            }

            document.getElementById('resultIcon').textContent = icon;
            document.getElementById('resultText').textContent = text;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('quizContent').classList.remove('hide');
            document.getElementById('result').classList.remove('show');
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
