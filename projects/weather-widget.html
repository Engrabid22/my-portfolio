<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Widget | Abid Ali Panhwar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            padding: 20px;
        }
        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0.9;
            transition: opacity 0.3s;
        }
        .back-link:hover {
            opacity: 1;
        }
        h1 {
            color: white;
            margin-bottom: 30px;
            font-weight: 300;
            text-align: center;
        }
        .weather-widget {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 35px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        .search-input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .search-input:focus {
            outline: none;
            border-color: #4facfe;
        }
        .search-btn {
            padding: 14px 20px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: transform 0.2s;
        }
        .search-btn:hover {
            transform: scale(1.05);
        }
        .weather-icon {
            font-size: 80px;
            margin-bottom: 10px;
        }
        .city-name {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 5px;
        }
        .date {
            color: #888;
            margin-bottom: 20px;
        }
        .temperature {
            font-size: 4rem;
            font-weight: 200;
            color: #333;
            margin-bottom: 10px;
        }
        .description {
            font-size: 1.2rem;
            color: #666;
            text-transform: capitalize;
            margin-bottom: 25px;
        }
        .details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding-top: 25px;
            border-top: 1px solid #eee;
        }
        .detail-item {
            text-align: center;
        }
        .detail-icon {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        .detail-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
        }
        .detail-label {
            font-size: 0.8rem;
            color: #999;
        }
        .forecast {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid #eee;
        }
        .forecast-day {
            text-align: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 12px;
        }
        .forecast-day-name {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 5px;
        }
        .forecast-icon {
            font-size: 1.5rem;
        }
        .forecast-temp {
            font-size: 0.9rem;
            font-weight: 600;
            color: #333;
        }
    </style>
</head>
<body>
    <a href="../index.html#gallery" class="back-link">← Back to Portfolio</a>
    <h1>🌤️ Weather Widget</h1>
    <div class="weather-widget">
        <div class="search-container">
            <input type="text" class="search-input" id="cityInput" placeholder="Enter city name..." value="San Francisco">
            <button class="search-btn" onclick="searchCity()">🔍</button>
        </div>
        <div id="weatherContent">
            <div class="weather-icon" id="weatherIcon">☀️</div>
            <h2 class="city-name" id="cityName">San Francisco</h2>
            <p class="date" id="currentDate">Monday, Feb 17</p>
            <div class="temperature" id="temperature">22°C</div>
            <p class="description" id="description">Sunny</p>
            <div class="details">
                <div class="detail-item">
                    <div class="detail-icon">💧</div>
                    <div class="detail-value" id="humidity">45%</div>
                    <div class="detail-label">Humidity</div>
                </div>
                <div class="detail-item">
                    <div class="detail-icon">💨</div>
                    <div class="detail-value" id="wind">12 km/h</div>
                    <div class="detail-label">Wind</div>
                </div>
                <div class="detail-item">
                    <div class="detail-icon">🌡️</div>
                    <div class="detail-value" id="feelsLike">20°C</div>
                    <div class="detail-label">Feels Like</div>
                </div>
            </div>
            <div class="forecast" id="forecast">
                <div class="forecast-day">
                    <div class="forecast-day-name">Tue</div>
                    <div class="forecast-icon">🌤️</div>
                    <div class="forecast-temp">21°C</div>
                </div>
                <div class="forecast-day">
                    <div class="forecast-day-name">Wed</div>
                    <div class="forecast-icon">☁️</div>
                    <div class="forecast-temp">18°C</div>
                </div>
                <div class="forecast-day">
                    <div class="forecast-day-name">Thu</div>
                    <div class="forecast-icon">🌧️</div>
                    <div class="forecast-temp">16°C</div>
                </div>
                <div class="forecast-day">
                    <div class="forecast-day-name">Fri</div>
                    <div class="forecast-icon">☀️</div>
                    <div class="forecast-temp">23°C</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const weatherData = {
            'san francisco': { temp: 22, icon: '☀️', desc: 'Sunny', humidity: 45, wind: 12, feels: 20 },
            'new york': { temp: 8, icon: '🌧️', desc: 'Rainy', humidity: 78, wind: 20, feels: 4 },
            'london': { temp: 12, icon: '☁️', desc: 'Cloudy', humidity: 65, wind: 15, feels: 10 },
            'tokyo': { temp: 18, icon: '🌤️', desc: 'Partly Cloudy', humidity: 55, wind: 8, feels: 17 },
            'paris': { temp: 14, icon: '🌥️', desc: 'Overcast', humidity: 60, wind: 18, feels: 12 },
            'sydney': { temp: 28, icon: '☀️', desc: 'Hot & Sunny', humidity: 35, wind: 10, feels: 30 },
            'dubai': { temp: 35, icon: '🌞', desc: 'Very Hot', humidity: 25, wind: 5, feels: 38 },
            'karachi': { temp: 30, icon: '☀️', desc: 'Hot & Clear', humidity: 50, wind: 14, feels: 32 },
        };

        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

        function updateDate() {
            const now = new Date();
            const dayName = days[now.getDay()];
            const month = months[now.getMonth()];
            const date = now.getDate();
            document.getElementById('currentDate').textContent = `${dayName}, ${month} ${date}`;
        }

        function searchCity() {
            const city = document.getElementById('cityInput').value.toLowerCase().trim();
            const data = weatherData[city];

            if (data) {
                document.getElementById('cityName').textContent = city.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                document.getElementById('temperature').textContent = `${data.temp}°C`;
                document.getElementById('weatherIcon').textContent = data.icon;
                document.getElementById('description').textContent = data.desc;
                document.getElementById('humidity').textContent = `${data.humidity}%`;
                document.getElementById('wind').textContent = `${data.wind} km/h`;
                document.getElementById('feelsLike').textContent = `${data.feels}°C`;
            } else {
                alert('City not found. Try: San Francisco, New York, London, Tokyo, Paris, Sydney, Dubai, or Karachi');
            }
        }

        document.getElementById('cityInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchCity();
        });

        updateDate();
    </script>
</body>
</html>
