<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator | Abid Ali Panhwar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            padding: 20px;
        }

        .calculator {
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 420px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-weight: 600;
            font-size: 1.8rem;
        }

        .emoji {
            font-size: 2rem;
            display: block;
            text-align: center;
            margin-bottom: 10px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
        }

        .currency-symbol {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 18px;
            font-weight: 600;
        }

        input[type="number"] {
            width: 100%;
            padding: 15px 15px 15px 35px;
            font-size: 18px;
            border: 2px solid #eee;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input[type="number"]:focus {
            border-color: #fda085;
        }

        .tip-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .tip-btn {
            padding: 15px;
            font-size: 16px;
            border: 2px solid #eee;
            background: white;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .tip-btn:hover {
            border-color: #fda085;
            color: #fda085;
        }

        .tip-btn.active {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            border-color: transparent;
            color: white;
        }

        .people-control {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .people-btn {
            width: 45px;
            height: 45px;
            border: 2px solid #eee;
            background: white;
            border-radius: 12px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .people-btn:hover {
            border-color: #fda085;
            color: #fda085;
        }

        .people-count {
            flex: 1;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            color: #333;
        }

        .results {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            padding: 25px;
            border-radius: 15px;
            margin-top: 30px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .result-row:last-child {
            margin-bottom: 0;
            padding-top: 15px;
            border-top: 2px solid rgba(255, 255, 255, 0.3);
        }

        .result-label {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
        }

        .result-label small {
            display: block;
            font-size: 12px;
            opacity: 0.8;
        }

        .result-value {
            color: white;
            font-size: 24px;
            font-weight: 700;
        }

        .reset-btn {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .reset-btn:hover {
            background: #f5f5f5;
        }

        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateX(-5px);
        }
    </style>
</head>
<body>
    <a href="../index.html#gallery" class="back-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Back to Portfolio
    </a>

    <div class="calculator">
        <span class="emoji">💰</span>
        <h1>Tip Calculator</h1>

        <div class="input-group">
            <label>Bill Amount</label>
            <div class="input-wrapper">
                <span class="currency-symbol">$</span>
                <input type="number" id="billAmount" placeholder="0.00" oninput="calculate()">
            </div>
        </div>

        <div class="input-group">
            <label>Select Tip %</label>
            <div class="tip-buttons">
                <button class="tip-btn" onclick="selectTip(5)">5%</button>
                <button class="tip-btn" onclick="selectTip(10)">10%</button>
                <button class="tip-btn active" onclick="selectTip(15)">15%</button>
                <button class="tip-btn" onclick="selectTip(20)">20%</button>
                <button class="tip-btn" onclick="selectTip(25)">25%</button>
                <button class="tip-btn" onclick="selectTip(30)">30%</button>
            </div>
        </div>

        <div class="input-group">
            <label>Number of People</label>
            <div class="people-control">
                <button class="people-btn" onclick="changePeople(-1)">−</button>
                <span class="people-count" id="peopleCount">1</span>
                <button class="people-btn" onclick="changePeople(1)">+</button>
            </div>
        </div>

        <div class="results">
            <div class="result-row">
                <div class="result-label">
                    Tip Amount
                    <small>/ person</small>
                </div>
                <div class="result-value" id="tipPerPerson">$0.00</div>
            </div>
            <div class="result-row">
                <div class="result-label">
                    Total
                    <small>/ person</small>
                </div>
                <div class="result-value" id="totalPerPerson">$0.00</div>
            </div>
        </div>

        <button class="reset-btn" onclick="reset()">Reset</button>
    </div>

    <script>
        let tipPercent = 15;
        let people = 1;

        function selectTip(percent) {
            tipPercent = percent;
            document.querySelectorAll('.tip-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            calculate();
        }

        function changePeople(delta) {
            people = Math.max(1, people + delta);
            document.getElementById('peopleCount').textContent = people;
            calculate();
        }

        function calculate() {
            const bill = parseFloat(document.getElementById('billAmount').value) || 0;
            const tip = bill * (tipPercent / 100);
            const total = bill + tip;

            const tipPerPerson = tip / people;
            const totalPerPerson = total / people;

            document.getElementById('tipPerPerson').textContent = '$' + tipPerPerson.toFixed(2);
            document.getElementById('totalPerPerson').textContent = '$' + totalPerPerson.toFixed(2);
        }

        function reset() {
            document.getElementById('billAmount').value = '';
            people = 1;
            tipPercent = 15;
            document.getElementById('peopleCount').textContent = '1';
            document.querySelectorAll('.tip-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tip-btn')[2].classList.add('active');
            document.getElementById('tipPerPerson').textContent = '$0.00';
            document.getElementById('totalPerPerson').textContent = '$0.00';
        }
    </script>
</body>
</html>
