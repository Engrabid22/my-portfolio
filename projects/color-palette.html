<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Generator | Abid Ali Panhwar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
        }

        .palette {
            display: flex;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            margin-bottom: 30px;
        }

        .color-box {
            flex: 1;
            height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 20px;
            cursor: pointer;
            transition: flex 0.3s ease;
            position: relative;
        }

        .color-box:hover {
            flex: 1.2;
        }

        .color-code {
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            transition: transform 0.3s ease;
        }

        .color-box:hover .color-code {
            transform: scale(1.1);
        }

        .copied {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .copied.show {
            opacity: 1;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 40px;
            font-size: 16px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-generate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-export {
            background: white;
            color: #333;
            border: 2px solid #eee;
        }

        .btn-export:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .instructions {
            text-align: center;
            color: #888;
            margin-top: 20px;
            font-size: 14px;
        }

        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #333;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .back-link:hover {
            transform: translateX(-5px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        @media (max-width: 768px) {
            .palette {
                flex-direction: column;
            }
            .color-box {
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <a href="../index.html#gallery" class="back-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Back to Portfolio
    </a>

    <div class="container">
        <h1>Color Palette Generator</h1>
        <p class="subtitle">Click on any color to copy its hex code</p>
        
        <div class="palette" id="palette">
            <!-- Colors will be generated here -->
        </div>

        <div class="controls">
            <button class="btn btn-generate" onclick="generatePalette()">
                🎨 Generate New Palette
            </button>
            <button class="btn btn-export" onclick="exportPalette()">
                📋 Copy All Colors
            </button>
        </div>

        <p class="instructions">Press <strong>Spacebar</strong> to quickly generate a new palette</p>
    </div>

    <script>
        let currentColors = [];

        function generateRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }

        function generatePalette() {
            const palette = document.getElementById('palette');
            palette.innerHTML = '';
            currentColors = [];

            for (let i = 0; i < 5; i++) {
                const color = generateRandomColor();
                currentColors.push(color);

                const colorBox = document.createElement('div');
                colorBox.className = 'color-box';
                colorBox.style.backgroundColor = color;
                colorBox.innerHTML = `
                    <span class="color-code">${color}</span>
                    <span class="copied">Copied!</span>
                `;
                colorBox.onclick = () => copyColor(color, colorBox);
                palette.appendChild(colorBox);
            }
        }

        function copyColor(color, element) {
            navigator.clipboard.writeText(color);
            const copiedEl = element.querySelector('.copied');
            copiedEl.classList.add('show');
            setTimeout(() => copiedEl.classList.remove('show'), 1000);
        }

        function exportPalette() {
            const allColors = currentColors.join(', ');
            navigator.clipboard.writeText(allColors);
            alert('All colors copied to clipboard!\n\n' + allColors);
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                generatePalette();
            }
        });

        // Generate initial palette
        generatePalette();
    </script>
</body>
</html>
